algorithm: TRPO
environment: CartPole-v1
action_space: discrete
threshold: 475.0
max_steps: 150_000
eval_freq: 5_000
eval_episodes: 10

# TRPO needs a large rollout per update for a stable Fisher/KL estimate;
# small n_steps (512/1024) makes the natural-gradient step noisy and the line
# search reject steps, collapsing CartPole convergence. n_steps=2048 (x8 envs)
# reliably solves CartPole across seeds.
hyperparameters:
  n_envs: 8
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.97
  max_kl: 0.01
  damping: 0.1
  cg_iters: 10
  line_search_steps: 10
  vf_lr: 1.0e-3
  vf_epochs: 5

policy:
  type: MlpPolicy
  hidden_sizes: [64, 64]
