algorithm: DQN
environment: CartPole-v1
action_space: discrete
threshold: 475.0
max_steps: 50_000
eval_freq: 1_000
eval_episodes: 10

# Hyperparameters from rl-baselines3-zoo (verified locally to hit 500/500 at 50k steps).
# Source: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/dqn.yml
# Previous defaults (lr=1e-4, target_update=10000) only reached ~200 — see
# docs/plans/results-inspection-2026-04-06.md.
hyperparameters:
  buffer_size: 100_000
  batch_size: 64
  learning_rate: 2.3e-3
  gamma: 0.99
  exploration_fraction: 0.16
  exploration_final_eps: 0.04
  target_update_freq: 10
  learning_starts: 1_000
  hidden: 256
  # SB3-only override (rlox _filter_hp skips train_freq/gradient_steps,
  # so these tune ONLY the SB3 run; rlox keeps train-every-step + MSE).
  # target_update_interval is SB3's name for target_update_freq.
  train_freq: 256
  gradient_steps: 128
  target_update_interval: 10
  # NOTE: rlox DQN uses MSE loss + train-every-step (train_freq=1) by
  # default. SB3 DQN uses Huber + train_freq=256 + gradient_steps=128.
  # The two paths converge to ~500/500 with their respective recipes;
  # crossing them (e.g. setting train_freq=256 here) DOES NOT WORK with
  # rlox's MSE because the per-step gradient is larger and the
  # algorithm relies on more frequent target syncs to stay stable.
  # See docs/plans/benchmark-comparison-inconsistencies.md.

policy:
  type: MlpPolicy
  hidden_sizes: [256, 256]
