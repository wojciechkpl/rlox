[project]
name = "rlox-verify"
version = "0.1.0"
description = "verifiers environment package wrapping the rlox Baseline/Treatment code-execution path"
tags = ["code-execution", "rlox", "single-turn", "synthetic"]
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.15.dev0",
    "httpx>=0.25",
    "datasets>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["rlox_verify/", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 8
rollouts_per_example = 4
