[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rlox"
version = "1.2.0"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
description = "Rust-accelerated reinforcement learning — 142x faster GAE, 53x faster rollouts. The Polars of RL."
readme = "README.md"
authors = [{name = "Wojciech Kowalinski"}]
keywords = ["reinforcement-learning", "rl", "rust", "ppo", "grpo", "dpo", "gymnasium"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]"]
gpu = ["torch>=2.0"]
dev = [
    "pytest",
    "pytest-timeout",
    "pyyaml",
    # TOML round-tripping for the agentic benchmark launchers and their tests.
    # tomllib is stdlib from 3.11; tomli is the 3.10 backport.
    "tomli; python_version < '3.11'",
    "tomli-w",
]
# `all` is what the CI wheel-smoke job installs; keep it a superset of the
# extras that do not need a GPU or an optional external service.
all = ["rlox[dev,mujoco]"]

[project.scripts]
rlox = "rlox.__main__:main"

[project.urls]
Homepage = "https://github.com/wojciechkpl/rlox"
Repository = "https://github.com/wojciechkpl/rlox"
Documentation = "https://github.com/wojciechkpl/rlox/tree/main/docs"
Changelog = "https://github.com/wojciechkpl/rlox/blob/main/CHANGELOG.md"
Issues = "https://github.com/wojciechkpl/rlox/issues"

[tool.maturin]
manifest-path = "crates/rlox-python/Cargo.toml"
module-name = "rlox._rlox_core"
python-source = "python"
features = ["pyo3/extension-module"]
# License files live at the repo root but the manifest is under crates/; include
# them explicitly so they are bundled into the sdist (PyPI validates that every
# declared License-File exists in the distribution).
include = ["LICENSE-APACHE", "LICENSE-MIT"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
