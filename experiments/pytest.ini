[pytest]
# ---------------------------------------------------------------------------
# rlox experiment framework — pytest configuration
# ---------------------------------------------------------------------------

# Default: only run correctness tests (fast, <1 s each).
# To also run performance benchmarks:
#   pytest -m "correctness or performance"
# To run convergence (slow) tests:
#   pytest -m convergence
# To run everything:
#   pytest -m ""   or   pytest --run-all
addopts = -m "correctness" -v --tb=short

# Custom markers
markers =
    correctness: Fast behavioral correctness tests (<1 s each). Run by default.
    performance: Timing benchmarks. Excluded by default; use -m performance.
    convergence: Full training-run tests. Very slow. Use -m convergence.
    slow: Alias for convergence. Marks long-running tests.

# Show slowest 10 tests in summary
# (requires pytest-durations or just --durations)
# --durations=10

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout per test (requires pytest-timeout)
# timeout = 60  # seconds per test; convergence tests override this

# Logging
log_cli = false
log_level = WARNING
