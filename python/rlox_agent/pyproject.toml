[project]
name = "rlox-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
verifiers = ["verifiers>=0.1.15.dev0", "datasets>=2.14"]
torch = ["rlox"]  # optional: rlox wheel from Maturin

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlox_agent"]
