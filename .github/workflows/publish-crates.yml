name: Publish crates

# Manual, deliberate publish of the rlox library crates to crates.io, in
# dependency order (rlox-rl-ops -> rlox-nn -> rlox-core). The experimental /
# app crates (rlox-burn, rlox-candle, rlox-sandbox) and the internal ones
# (rlox-python, rlox-grpc, rlox-bench) are `publish = false` and skipped.
#
# Default is a dry run; a real upload requires typing "publish" in the confirm
# input. Uses the CARGO_API_TOKEN repo secret (crates.io API token).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to actually upload to crates.io (anything else = dry run)'
        required: true
        default: 'dry-run'

env:
  # `cargo publish` runs a verification build; neutralise .cargo/config.toml's
  # target-cpu=native so it cannot SIGILL on a runner whose CPU differs from
  # whatever produced a cached artifact. Must be CARGO_ENCODED_RUSTFLAGS — an
  # empty CARGO_BUILD_RUSTFLAGS is silently ignored by cargo.
  CARGO_ENCODED_RUSTFLAGS: ""

jobs:
  publish:
    name: Publish rlox library crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (or dry-run) in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "confirm != 'publish' -> DRY RUN (rl-ops + nn; core can only be"
            echo "verified after rl-ops is live, so it is skipped in dry-run)."
            cargo publish --dry-run -p rlox-rl-ops
            cargo publish --dry-run -p rlox-nn
            echo "Dry run OK. Re-dispatch with confirm=publish to upload."
            exit 0
          fi
          echo "::group::publish rlox-rl-ops"
          cargo publish -p rlox-rl-ops
          echo "::endgroup::"
          echo "::group::publish rlox-nn"
          cargo publish -p rlox-nn
          echo "::endgroup::"
          echo "::group::publish rlox-core"
          cargo publish -p rlox-core
          echo "::endgroup::"
          echo "Published rlox-rl-ops, rlox-nn, rlox-core to crates.io."
