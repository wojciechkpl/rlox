name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  # Neutralise .cargo/config.toml's `build.rustflags = ["-C", "target-cpu=native"]`.
  # Native tuning must never reach a published wheel: these are distributed as
  # generic manylinux/macosx/win wheels, so a wheel built on a runner with (say)
  # AVX-512 crashes with SIGILL on any user CPU lacking it. Local builds keep
  # native tuning via the config file; releases must be portable.
  #
  # Must be CARGO_ENCODED_RUSTFLAGS: cargo treats an empty CARGO_BUILD_RUSTFLAGS
  # as unset and falls back to the config file (verified), making that spelling a
  # silent no-op.
  CARGO_ENCODED_RUSTFLAGS: ""

jobs:
  build-wheels:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # manylinux builds run inside a container, so the workflow-level
          # CARGO_ENCODED_RUSTFLAGS must be forwarded explicitly or the container
          # falls back to .cargo/config.toml and bakes target-cpu=native into the
          # published wheel. Ignored on the native macOS/Windows runners.
          docker-options: -e CARGO_ENCODED_RUSTFLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # API-token auth (repo secret). Trusted-publishing/OIDC remains the
          # path for the `release` trigger; this token covers manual dispatch.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PEP 740 attestations require a configured trusted publisher; disable
          # them on the token path.
          attestations: false
