name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Same reason as ci.yml: neutralise .cargo/config.toml's target-cpu=native so a
  # cached proc-macro dylib built on a different runner cannot SIGILL. Must be
  # CARGO_ENCODED_RUSTFLAGS — an empty CARGO_BUILD_RUSTFLAGS is silently ignored.
  CARGO_ENCODED_RUSTFLAGS: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps --exclude rlox-python --exclude rlox-bench --exclude rlox-grpc

      - name: Install and run mdbook
        run: |
          cargo install mdbook
          mdbook build

      - name: Build Python extension and MkDocs
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin numpy
          maturin develop --release
          # mkdocs-static-i18n serves .pl.md / .de.md / .fr.md translations
          # from the same tree. See docs/CONTRIBUTING-translations.md.
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-static-i18n
          mkdocs build -d site

      - name: Build Hugo blog
        run: |
          cd blog && hugo --minify

      - name: Assemble unified site
        run: |
          mkdir -p _site
          cp -r target/doc _site/rust
          cp -r book/build _site/book
          cp -r site _site/python
          cp -r blog/public _site/blog
          cp docs-landing/index.html _site/index.html
          cp docs-landing/rlox_logo.png _site/rlox_logo.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # The github-pages environment only permits deploys from the default branch,
    # so a workflow_dispatch on a feature branch would otherwise fail the run
    # with "Branch ... is not allowed to deploy to github-pages". Skip instead:
    # dispatching from a branch still exercises `build` as a docs smoke test.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
