[package]
name = "rlox-sandbox"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Hard-isolation sandbox worker: Linux namespaces + seccomp-bpf + cgroup v2"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# This crate targets Linux only.  It will not compile on macOS/Windows.

[[bin]]
name = "rlox-verify-server"
path = "src/bin/rlox_verify_server.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "fs", "net"] }
libc = "0.2"
nix = { version = "0.29", features = ["user", "fs", "mount", "sched", "signal", "process", "ptrace"] }
seccompiler = "0.4"
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
rlox-core = { path = "../rlox-core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "fs", "net"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.7", features = ["json"] }
